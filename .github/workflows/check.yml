# 検証系 CI(push / PR)。成果物はコミットせず、問題の検知のみを行う。
#
# - ruff-check : Python の Lint
# - site-build : ウェブサイトがビルドできること
# - paper-build: 論文図の再生成と LaTeX ビルドが通ること(artifact 確認用)
#
# paper-build は TeX Live コンテナの pull で数分かかるため paths フィルタで
# 独立ジョブに分離している。将来チェックを増やすときは matrix.include に追加する。

name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    name: ${{ matrix.task }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: ruff-check
          - task: site-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # NOTE: Node 版を明示しないとランナーのプリインストール版に依存し、
      # cookie の名前付き import など挙動差で site-build が壊れるため固定する。
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: "ruff-check: Ruff check"
        if: matrix.task == 'ruff-check'
        run: uv run ruff check .

      - name: "site-build: Website build"
        if: matrix.task == 'site-build'
        run: |
          cd website
          npx pnpm install --frozen-lockfile
          npx pnpm build

  # 論文ビルドは重い(TeX Live コンテナ)ため、関連ファイル変更時のみ実行する
  paper-build:
    runs-on: ubuntu-latest
    name: paper-build
    if: >
      github.event_name == 'pull_request' ||
      contains(github.event.head_commit.modified, 'paper/') ||
      contains(github.event.head_commit.added, 'paper/') ||
      contains(github.event.head_commit.removed, 'paper/') ||
      contains(github.event.head_commit.modified, 'paper_figures.py') ||
      contains(github.event.head_commit.added, 'paper_figures.py')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Build figures
        run: |
          uv run paper_figures.py \
            --input paper/result.csv \
            --output-dir paper/results/figures

      - name: Build PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: paper

      # 成果物はコミットしない。PR での PDF プレビューはここから入手する
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-pdf
          path: paper/main.pdf
