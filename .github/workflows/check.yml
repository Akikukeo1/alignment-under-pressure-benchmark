# 検証系 CI(push / PR)。成果物はコミットせず、問題の検知のみを行う。
#
# - ruff-check : Python の Lint
# - site-build : ウェブサイトがビルドできること
# - paper-build: 論文図の再生成と LaTeX ビルドが通ること(artifact 確認用)
# - update-preview: main push で全ジョブ成功後に Preview リリースを更新
#
# paper-build は TeX Live コンテナの pull で数分かかるが、PR / push とも常に実行する。
# 将来チェックを増やすときは matrix.include に追加する。

name: CI

on:
  push:
    branches:
      - main
    # ボットによる生成物のみの更新(update-data / publish-paper)は検証不要のため除外
    paths-ignore:
      - "website/src/data/results.json"
      - "website/public/results/**"
      - "website/public/paper.pdf"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    name: ${{ matrix.task }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: ruff-check
          - task: site-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Node 版は website/.node-version で管理(ローカル開発環境と同一版を用いる)
      - uses: actions/setup-node@v4
        with:
          node-version-file: website/.node-version

      - name: "ruff-check: Ruff check"
        if: matrix.task == 'ruff-check'
        run: uv run ruff check .

      - name: "site-build: Website build"
        if: matrix.task == 'site-build'
        run: |
          cd website
          npx pnpm install --frozen-lockfile
          npx pnpm build

  # 論文ビルドは TeX Live コンテナの pull で数分かかるが、常に実行する。
  # 論文は集計成果物(paper/result.csv 等)にも依存するため、paths フィルタだと漏れる。
  # Preview リリースへの反映は update-preview ジョブ(needs 成功後)が担う。
  paper-build:
    runs-on: ubuntu-latest
    name: paper-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Build figures
        run: |
          uv run paper_figures.py \
            --input paper/result.csv \
            --output-dir paper/results/figures

      - name: Build PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: paper
          # ltjsarticle は LuaTeX-ja 専用クラスのため LuaLaTeX でビルドする。
          # args に既定の -pdf(pdflatex 指定)を残すとエンジン指定と競合するため除外。
          latexmk_use_lualatex: true
          args: -file-line-error -halt-on-error -interaction=nonstopmode

      # 成果物はコミットしない。PR での PDF プレビューはここから入手する。
      # Preview リリース用に update-preview ジョブへも artifact 経由で受け渡す。
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-pdf
          path: paper/main.pdf

      - name: Upload figures artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-figures
          path: paper/results/figures

  # Preview リリースの更新。CI(ruff / site-build / paper-build)がすべて成功した後のみ実行する。
  # NOTE: update-data.yml 側の同名ジョブと concurrency グループ(preview-release)を共有し、
  # 同時実行によるリリース削除&再作成の競合(レース)を防ぐ。
  # 毎回削除&再作成することで created_at が更新され、Releases 一覧で
  # 正式版(Latest バッジ)の直下 2 番目に常に表示される。
  # preview タグの再作成イベントを Zenodo が拾わないよう、DOI 連携時は正式版のみ対象にすること。
  update-preview:
    runs-on: ubuntu-latest
    name: update-preview
    needs: [check, paper-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    concurrency:
      group: preview-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: paper-pdf
          path: dist-assets/
      - uses: actions/download-artifact@v4
        with:
          name: paper-figures
          path: dist-assets/figures/

      # NOTE: results/ と tasks/ はコミット済みの内容をそのまま同梱する(冪等)
      - name: Prepare preview assets
        run: |
          cp dist-assets/main.pdf aupb-paper-preview.pdf
          mkdir -p zipsrc/results && cp -r dist-assets/figures zipsrc/results/figures
          cp paper/result.csv zipsrc/
          cd zipsrc && zip -r ../aupb-data-preview.zip result.csv results && cd ..
          STAGE="aupb-preview"
          mkdir -p "$STAGE/paper/results"
          cp aupb-paper-preview.pdf "$STAGE/"
          cp paper/result.csv "$STAGE/paper/"
          mkdir -p "$STAGE/paper/results/figures" && cp dist-assets/figures/*.png "$STAGE/paper/results/figures/"
          cp -r tasks "$STAGE/tasks"
          cp -r results "$STAGE/results"
          cp REPRODUCIBILITY.md "$STAGE/"
          zip -r "aupb-preview-all.zip" "$STAGE"

      - name: Delete old preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete preview --cleanup-tag --yes || true

      - name: Create preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview
          name: Preview — 先行公開版(常に最新)
          body: |
            main ブランチの最新状態を常に反映した先行公開版です。

            - `aupb-paper-preview.pdf` — 論文本体
            - `aupb-data-preview.zip` — 集計結果(result.csv)+ 論文図
            - `aupb-preview-all.zip` — 上記 + タスク定義(tasks/)・集計結果(results/)・再現手順を含む全部入り

            引用や DOI が必要な場合は正式版(Paper vX.Y)をご利用ください。
          prerelease: true
          make_latest: false
          files: |
            aupb-paper-preview.pdf
            aupb-data-preview.zip
            aupb-preview-all.zip
