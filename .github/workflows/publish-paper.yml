# 論文 PDF の公開(手動実行)。
# 図を再生成して論文 PDF をビルドし、website/public/paper.pdf を更新して main に push した後、
# Cloudflare Pages へ Direct Upload し、GitHub Release(vX.Y)を作成する。
#
# バージョニング: vX.Y 形式で自動採番(既存タグの最大 Y + 1。初回は v0.1)。
# 「Major」チェックで X を +1(Y は 0 にリセット)。開発期は X = 0。
#
# asset:
#   - aupb-paper-vX.Y.pdf : 論文単体
#   - aupb-data-vX.Y.zip  : result.csv + 論文図
#   - aupb-vX.Y-all.zip   : 上記 + タスク定義(tasks/)・集計結果(results/)・再現手順の全部入り
# Zenodo 連携による DOI 発行も可能。preview タグは削除&再作成されるため
# Zenodo に拾わせたい場合は正式版タグのみを対象にすること。
#
# 注意: LaTeX ソースのローカルテスト環境はないため、main.tex を変更した場合は
# まず check.yml の paper-build で検証してから、このワークフローで公開する。

name: Publish paper

on:
  workflow_dispatch:
    inputs:
      major:
        description: 'メジャーバージョンを上げる(X+1, Y=0)。通常は空のまま'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-paper
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 正式版バージョンの自動採番(vX.Y 形式)
      # NOTE: inputs.major を直接 run に展開すると script injection の恐れがあるため env 経由。
      # NOTE: glob パターンでは v0.4-rc1 等の接尾付きタグも拾うため、grep で vX.Y 厳密一致のみに絞る。
      - name: Determine version
        env:
          MAJOR: ${{ inputs.major }}
        run: |
          LATEST=$(git tag --list 'v[0-9]*.[0-9]*' | grep -E '^v[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [ "$MAJOR" = "true" ]; then
            X=$(echo "${LATEST:-v0.0}" | tr -d 'v' | cut -d. -f1)
            VERSION="v$((X + 1)).0"
          elif [ -z "$LATEST" ]; then
            VERSION="v0.1"
          else
            X=$(echo "$LATEST" | tr -d 'v' | cut -d. -f1)
            Y=$(echo "$LATEST" | tr -d 'v' | cut -d. -f2)
            VERSION="v${X}.$((Y + 1))"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "採番されたバージョン: $VERSION"

      # 図の再生成(uv + matplotlib)。日本語ラベルのため CJK フォントが必要
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Build figures
        run: |
          uv run paper_figures.py \
            --input paper/result.csv \
            --output-dir paper/results/figures

      # PDF ビルド(TeX Live コンテナ内で実行。
      # QR は事前変換済み PDF を includegraphics するため Inkscape 不要)
      - name: Build PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: paper
          # ltjsarticle は LuaTeX-ja 専用クラスのため LuaLaTeX でビルドする。
          # args に既定の -pdf(pdflatex 指定)を残すとエンジン指定と競合するため除外。
          latexmk_use_lualatex: true
          args: -file-line-error -halt-on-error -interaction=nonstopmode

      # ビルド成果物をサイトの配信位置へ配置
      # (public/results/ は generate_results.py が丸ごと再構築するため触らない)
      - name: Copy PDF into website
        run: cp paper/main.pdf website/public/paper.pdf

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/public/paper.pdf
          if git diff --cached --quiet; then
            echo "変更がないためコミットをスキップします"
            exit 0
          fi
          # NOTE: [skip ci] により GitHub Actions の再発火を防止。
          # Cloudflare Pages の Git 連携は Actions(bot)の push をデプロイしないため、
          # 配信は下記 Deploy to Cloudflare Pages(Direct Upload)が担う。
          git commit -m "Update paper.pdf for $VERSION [skip ci]"
          git push

      # NOTE: Cloudflare Pages は bot push を Git 連携で無視するため、ここでビルドして Direct Upload する。
      - uses: actions/setup-node@v4
        with:
          node-version-file: website/.node-version
      - name: Build site
        run: |
          cd website
          npx pnpm install --frozen-lockfile
          npx pnpm build

      # NOTE: wrangler-action@v3 は wrangler 導入時に pnpm を要求して失敗するため npx で直接実行する
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd website
          npx wrangler pages deploy dist --project-name=alignment-under-pressure-benchmark --branch=main

      # Release 用 asset の準備
      # NOTE: results/ と tasks/ はコミット済みの内容をそのまま同梱する
      # (update-data.yml が常時最新化しているため再実行不要・冪等)
      - name: Prepare release assets
        run: |
          cp paper/main.pdf "aupb-paper-$VERSION.pdf"
          cd paper && zip -r "../aupb-data-$VERSION.zip" result.csv results/figures && cd ..
          STAGE="aupb-${VERSION#v}"
          mkdir -p "$STAGE/paper/results"
          cp "aupb-paper-$VERSION.pdf" "$STAGE/"
          cp paper/result.csv "$STAGE/paper/"
          cp -r paper/results/figures "$STAGE/paper/results/"
          cp -r tasks "$STAGE/tasks"
          cp -r results "$STAGE/results"
          cp REPRODUCIBILITY.md "$STAGE/"
          zip -r "aupb-$VERSION-all.zip" "$STAGE"

      # 正式版 Release(タグが存在しなければ HEAD に自動作成される)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Paper ${{ env.VERSION }}
          body: |
            論文と成果物の正式リリースです。

            - `aupb-paper-${{ env.VERSION }}.pdf` — 論文本体
            - `aupb-data-${{ env.VERSION }}.zip` — 集計結果(result.csv)+ 論文図
            - `aupb-${{ env.VERSION }}-all.zip` — 上記 + タスク定義(tasks/)・集計結果(results/)・再現手順を含む全部入り

            再現手順は [REPRODUCIBILITY.md](https://github.com/${{ github.repository }}/blob/${{ env.VERSION }}/REPRODUCIBILITY.md) を参照し、このタグを checkout してください。
          files: |
            aupb-paper-${{ env.VERSION }}.pdf
            aupb-data-${{ env.VERSION }}.zip
            aupb-${{ env.VERSION }}-all.zip
          generate_release_notes: true
