# 論文 PDF の公開(手動実行)。
# 図を再生成して論文 PDF をビルドし、website/public/paper.pdf とバージョンメタデータ
# (website/src/data/paper.json)を更新して main に push した後、
# Cloudflare Pages へ Direct Upload し、GitHub Release(vX.Y)を作成する。
#
# バージョニング: vX.Y 形式で自動採番(既存タグの最大 Y + 1。初回は v0.1)。
# 「Major」チェックで X を +1(Y は 0 にリセット)。開発期は X = 0。
#
# asset:
#   - aupb-paper-vX.Y.pdf : 論文単体
#   - aupb-data-vX.Y.zip  : リーダーボード CSV(数値根拠)+ 論文図
#   - aupb-vX.Y-all.zip   : 上記 + タスク定義(tasks/)・集計結果(results/)・再現手順の全部入り
#
# 注意: LaTeX ソースのローカルテスト環境はないため、main.tex を変更した場合は
# まず Pipeline(pipeline.yml)の latex ジョブで検証してから、このワークフローで公開する。

name: Publish paper

on:
  workflow_dispatch:
    inputs:
      major:
        description: 'メジャーバージョンを上げる(X+1, Y=0)。通常は空のまま'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-paper
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # NOTE: fetch-depth: 0(完全クローン)が必須。shallow clone ではタグが取得されず、
      # Generate paper metadata(git for-each-ref)が履歴を取り違えて
      # paper.json の旧バージョンを全消しする事故が起きる
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 正式版バージョンの自動採番(vX.Y 形式)
      # NOTE: inputs.major を直接 run に展開すると script injection の恐れがあるため env 経由。
      # NOTE: 既存バージョンの取得は git tag ではなく GitHub API を使う
      # (actions/checkout の shallow clone ではタグが取得されず、採番が常に v0.1 になる事故があった)。
      # NOTE: preview タグは vX.Y 形式でないため grep で自然に除外される。
      - name: Determine version
        env:
          MAJOR: ${{ inputs.major }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(gh release list --limit 100 --exclude-drafts --json tagName --jq '.[].tagName' \
            | grep -E '^v[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [ "$MAJOR" = "true" ]; then
            X=$(echo "${LATEST:-v0.0}" | tr -d 'v' | cut -d. -f1)
            VERSION="v$((X + 1)).0"
          elif [ -z "$LATEST" ]; then
            VERSION="v0.1"
          else
            X=$(echo "$LATEST" | tr -d 'v' | cut -d. -f1)
            Y=$(echo "$LATEST" | tr -d 'v' | cut -d. -f2)
            VERSION="v${X}.$((Y + 1))"
          fi
          # 既存リリースとの重複ガード(action-gh-release が既存リリースを
          # 上書き更新してしまう事故を防ぐ。正式版は一度公開したら不変であるべき)
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "::error::Release $VERSION は既に存在します。採番に失敗した可能性があるため停止します。"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "採番されたバージョン: $VERSION"

      # 図の再生成(uv + matplotlib)。日本語ラベルのため CJK フォントが必要
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Build figures
        run: |
          uv run paper_figures.py \
            --output-dir paper/dist/figures

      # PDF ビルド(TeX Live コンテナ内で実行。
      # QR は事前変換済み PDF を includegraphics するため Inkscape 不要)
      - name: Build PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: paper
          # ltjsarticle は LuaTeX-ja 専用クラスのため LuaLaTeX でビルドする。
          # args に既定の -pdf(pdflatex 指定)を残すとエンジン指定と競合するため除外。
          latexmk_use_lualatex: true
          args: -file-line-error -halt-on-error -interaction=nonstopmode

      # ビルド成果物をサイトの配信位置へ配置
      # (public/results/ は generate_results.py が丸ごと再構築するため触らない)
      - name: Copy PDF into website
        run: cp paper/main.pdf website/public/paper.pdf

      # 論文ページ用のバージョンメタデータ(paper.json)を更新。
      # 採番直後で今回分のタグが未作成のため、env で現行版を上書きする
      # (時刻はスクリプト内で UTC 正規化され、ランナーの TZ 設定に依存しない)
      - name: Generate paper metadata
        env:
          PAPER_CURRENT_VERSION: ${{ env.VERSION }}
        run: |
          export PAPER_CURRENT_PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          uv run website/scripts/generate_paper_meta.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/public/paper.pdf website/src/data/paper.json
          if git diff --cached --quiet; then
            echo "変更がないためコミットをスキップします"
            exit 0
          fi
          # NOTE: [skip ci] により GitHub Actions の再発火を防止。
          # Cloudflare Pages の Git 連携は Actions(bot)の push をデプロイしないため、
          # 配信は下記 Deploy to Cloudflare Pages(Direct Upload)が担う。
          git commit -m "Update paper.pdf for $VERSION [skip ci]"
          git push

      # NOTE: Cloudflare Pages は bot push を Git 連携で無視するため、ここでビルドして Direct Upload する。
      - uses: actions/setup-node@v4
        with:
          node-version-file: website/.node-version
      - name: Build site
        run: |
          cd website
          npx pnpm install --frozen-lockfile
          npx pnpm build

      # NOTE: wrangler-action@v3 は wrangler 導入時に pnpm を要求して失敗するため npx で直接実行する
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd website
          npx wrangler pages deploy dist --project-name=alignment-under-pressure-benchmark --branch=main

      # Release 用 asset の準備
      # NOTE: results/ と tasks/ はコミット済みの内容をそのまま同梱する
      # (Pipeline の publish-data ジョブが常時最新化しているため冪等)
      - name: Prepare release assets
        run: |
          cp paper/main.pdf "aupb-paper-$VERSION.pdf"
          mkdir -p zipsrc/figures && cp -r paper/dist/figures/. zipsrc/figures/
          cp akikukeo1_alignment-under-pressure-benchmark_leaderboard.csv zipsrc/
          (cd zipsrc && zip -r "../aupb-data-$VERSION.zip" .)
          STAGE="aupb-${VERSION#v}"
          mkdir -p "$STAGE/paper/dist"
          cp "aupb-paper-$VERSION.pdf" "$STAGE/"
          cp akikukeo1_alignment-under-pressure-benchmark_leaderboard.csv "$STAGE/"
          cp -r paper/dist/figures "$STAGE/paper/dist/"
          cp -r tasks "$STAGE/tasks"
          cp -r results "$STAGE/results"
          cp REPRODUCIBILITY.md "$STAGE/"
          zip -r "aupb-$VERSION-all.zip" "$STAGE"

      # 正式版 Release(タグが存在しなければ HEAD に自動作成される)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Paper ${{ env.VERSION }}
          body: |
            論文と成果物の正式リリースです。以下のリンクからダウンロードできます。

            - [`aupb-paper-${{ env.VERSION }}.pdf`](https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/aupb-paper-${{ env.VERSION }}.pdf) — 論文本体
            - [`aupb-data-${{ env.VERSION }}.zip`](https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/aupb-data-${{ env.VERSION }}.zip) — リーダーボード CSV（数値根拠）+ 論文図
            - [`aupb-${{ env.VERSION }}-all.zip`](https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/aupb-${{ env.VERSION }}-all.zip) — 上記 + タスク定義(tasks/)・集計結果(results/)・再現手順を含む全部入り

            再現手順は [REPRODUCIBILITY.md](https://github.com/${{ github.repository }}/blob/${{ env.VERSION }}/REPRODUCIBILITY.md) を参照し、このタグを checkout してください。
          files: |
            aupb-paper-${{ env.VERSION }}.pdf
            aupb-data-${{ env.VERSION }}.zip
            aupb-${{ env.VERSION }}-all.zip
          generate_release_notes: true
