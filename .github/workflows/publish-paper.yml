# 論文 PDF の公開(手動実行)。
# 図を再生成して論文 PDF をビルドし、website/public/paper.pdf を更新して
# main に push する。push 後、Cloudflare Pages がサイトを自動デプロイする。
#
# 注意: LaTeX ソースのローカルテスト環境はないため、main.tex を変更した場合は
# まず check.yml の paper-build で検証してから、このワークフローで公開する。

name: Publish paper

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-paper
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 図の再生成(uv + matplotlib)。日本語ラベルのため CJK フォントが必要
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Build figures
        run: |
          uv run paper_figures.py \
            --input paper/result.csv \
            --output-dir paper/results/figures

      # PDF ビルド(TeX Live コンテナ内で実行。
      # QR は事前変換済み PDF を includegraphics するため Inkscape 不要)
      - name: Build PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: paper
          # ltjsarticle は LuaTeX-ja 専用クラスのため LuaLaTeX でビルドする。
          # args に既定の -pdf(pdflatex 指定)を残すとエンジン指定と競合するため除外。
          latexmk_use_lualatex: true
          args: -file-line-error -halt-on-error -interaction=nonstopmode

      # ビルド成果物をサイトの配信位置へ配置
      # (public/results/ は generate_results.py が丸ごと再構築するため触らない)
      - name: Copy PDF into website
        run: cp paper/main.pdf website/public/paper.pdf

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/public/paper.pdf
          if git diff --cached --quiet; then
            echo "変更がないためコミットをスキップします"
            exit 0
          fi
          # NOTE: [skip ci] により GitHub Actions の再発火を防止。
          # Cloudflare Pages の Git 連携は Actions(bot)の push をデプロイしないため、
          # 配信は下記 Deploy to Cloudflare Pages(Direct Upload)が担う。
          git commit -m "Update paper.pdf [skip ci]"
          git push

      # NOTE: Cloudflare Pages は bot push を Git 連携で無視するため、ここでビルドして Direct Upload する。
      - uses: actions/setup-node@v4
        with:
          node-version-file: website/.node-version
      - name: Build site
        run: |
          cd website
          npx pnpm install --frozen-lockfile
          npx pnpm build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          command: pages deploy dist --project-name=alignment-under-pressure-benchmark --branch=main
