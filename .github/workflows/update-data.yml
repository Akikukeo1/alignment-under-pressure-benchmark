# 評価データのサイト反映(自動実行)。
# リーダーボード CSV や集計ロジックの変更を push したとき、
# just update 相当(aggregate → figures → sync-data)を実行し、
# 生成物(results.json + public/results/*.png)を main に push する。
# push 後、Cloudflare Pages がサイトを自動デプロイする。
#
# 論文 PDF の更新は行わない。公開は Publish paper ワークフローで手動に行う。

name: Update data

on:
  push:
    paths:
      - "results/**"
      - "tasks/**"
      - "config.toml"
      - "aggregate.py"
      - "charts.py"
      - "paper_figures.py"
      - "website/scripts/**"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 図内の日本語描画用。ランナーに CJK フォントが無いと豆腐になる
      - name: Install CJK fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      # aggregate → figures → sync-data → site ビルド & デプロイ相当
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Aggregate
        run: uv run aggregate.py
      - name: Build figures
        run: |
          uv run paper_figures.py \
            --input akikukeo1_alignment-under-pressure-benchmark_leaderboard.csv
      # Node 版は website/.node-version で管理(ローカル開発環境と同一版を用いる)
      - uses: actions/setup-node@v4
        with:
          node-version-file: website/.node-version
      - name: Sync data
        run: |
          cd website
          npx pnpm install --frozen-lockfile
          npx pnpm gen:data

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/src/data/results.json website/public/results
          if git diff --cached --quiet; then
            echo "変更がないためコミットをスキップします"
            exit 0
          fi
          # NOTE: [skip ci] により GitHub Actions の再発火を防止。
          # Cloudflare Pages の Git 連携は Actions(bot)の push をデプロイしないため、
          # 配信は下記 Deploy to Cloudflare Pages(Direct Upload)が担う。
          git commit -m "Update site data [skip ci]"
          git push

      # NOTE: Cloudflare Pages は bot push を Git 連携で無視するため、ここでビルドして Direct Upload する。
      - name: Build site
        run: |
          cd website
          npx pnpm build

      # NOTE: wrangler-action@v3 は wrangler 導入時に pnpm を要求して失敗するため npx で直接実行する
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd website
          npx wrangler pages deploy dist --project-name=alignment-under-pressure-benchmark --branch=main

      # --- Preview リリースの更新(bot push のデータ更新でも追従させる) ---
      # 論文用図を最新化(論文 PDF 自体は前回公開分 website/public/paper.pdf を使用)
      - name: Build paper figures
        run: |
          uv run paper_figures.py \
            --input paper/result.csv \
            --output-dir paper/results/figures

      # NOTE: results/ と tasks/ はコミット済みの内容をそのまま同梱する(冪等)
      - name: Prepare preview assets
        run: |
          cp website/public/paper.pdf aupb-paper-preview.pdf
          cd paper && zip -r ../aupb-data-preview.zip result.csv results/figures && cd ..
          STAGE="aupb-preview"
          mkdir -p "$STAGE/paper/results"
          cp aupb-paper-preview.pdf "$STAGE/"
          cp paper/result.csv "$STAGE/paper/"
          cp -r paper/results/figures "$STAGE/paper/results/"
          cp -r tasks "$STAGE/tasks"
          cp -r results "$STAGE/results"
          cp REPRODUCIBILITY.md "$STAGE/"
          zip -r "aupb-preview-all.zip" "$STAGE"

      # NOTE: 毎回削除&再作成することで created_at が更新され、Releases 一覧で
      # 正式版(Latest バッジ)の直下 2 番目に常に表示される。
      # preview タグの再作成イベントを Zenodo が拾わないよう、DOI 連携時は正式版のみ対象にすること。
      - name: Delete old preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete preview --cleanup-tag --yes || true

      - name: Create preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview
          name: Preview — 先行公開版(常に最新)
          body: |
            main ブランチの最新状態を常に反映した先行公開版です。

            - `aupb-paper-preview.pdf` — 論文本体
            - `aupb-data-preview.zip` — 集計結果(result.csv)+ 論文図
            - `aupb-preview-all.zip` — 上記 + タスク定義(tasks/)・集計結果(results/)・再現手順を含む全部入り

            引用や DOI が必要な場合は正式版(Paper vX.Y)をご利用ください。
          prerelease: true
          make_latest: false
          files: |
            aupb-paper-preview.pdf
            aupb-data-preview.zip
            aupb-preview-all.zip
