[project]
name = "alignment-under-pressure-benchmark"

version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "kagglehub>=1.0.2",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "ruff>=0.15.20",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "ruff>=0.15.15",
]

[tool.ruff]
exclude = [".git", ".venv", "build", "dist", "generated", "paper/results/figures", "website/public"]
line-length = 120
indent-width = 4
target-version = "py313"
# NOTE: Ruff は 314 に対応するが、新構文にエコシステムが追いついていないため、313 を指定する。将来的に 314 に変更する。
preview = false

[tool.ruff.lint]
mccabe = {max-complexity = 15}
select = [
  "B",
  "D",
  "E",
  "F",
  "I",
  "N",
  "W",
  "C90",
  "TID252",
  "PGH003",
  "UP",
  "SIM",
  "RUF",
  "PIE",
  "PTH",
  "RET",
  "DTZ",
  "ARG",
  "NPY",
]
# NOTE: D100〜D103・D400・D415 は docstring 強制を外すための無効化。
# NOTE: RUF001-RUF003 は日本語文中の全角記号(×など)を誤検知するため無効化(本リポジトリは日本語で執筆する)。
# NOTE: B905・PTH123・SIM108・PIE810・RUF005 は堅牢性・可読性向上寄りのスタイル強制のため無効化。
# NOTE: E501 は build.py の f-string テンプレート内部の長行など、折り返せない行があるため無効化(formatter の line-length 規律は維持)。
ignore = [
  "B905",
  "D100",
  "D101",
  "D102",
  "D103",
  "D400",
  "D415",
  "E501",
  "PIE810",
  "PTH123",
  "RUF001",
  "RUF002",
  "RUF003",
  "RUF005",
  "SIM108",
]
